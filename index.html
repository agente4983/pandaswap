<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Configuración SEO para buscadores -->
    <title>Panda Swap | Intercambio de Criptomonedas en Red Solana</title>
    <meta name="description" content="Panda Swap es la plataforma líder para realizar intercambios rápidos y seguros en la red de Solana. Accede a las mejores cotizaciones, usa tu billetera Phantom y opera con total transparencia.">
    <meta name="keywords" content="Panda Swap, Solana, Intercambio cripto, Phantom Wallet, Criptomonedas, Trading, Bitcoin, USDT, ARS">

    <style>
        body { background-color: #EADDCA; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Título Azul Francia con borde Plateado fino */
        h1 { 
            color: #002366; 
            font-size: 2.6em; 
            text-transform: uppercase; 
            font-weight: 700; 
            margin: 40px 0 20px 0; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #C0C0C0, -1px -1px 0 #C0C0C0, 1px -1px 0 #C0C0C0, -1px 1px 0 #C0C0C0;
        }
        
        .solana-icon { height: 0.9em; margin-right: 12px; }
        .subtitulo { color: #4A3C31; font-size: 1em; margin-bottom: 35px; }
        
        .btn-swap { 
            background-color: #002366; color: white; padding: 18px 45px; border: none; 
            border-radius: 8px; font-size: 1.3em; cursor: pointer; margin-bottom: 40px; font-weight: bold; 
        }

        .chart-container { width: 100%; max-width: 900px; height: 380px; margin-bottom: 30px; background: #FAF9F6; border-radius: 8px; border: 1px solid #CDBA96; }

        .btn-bot { position: fixed; bottom: 20px; right: 20px; background-color: #002366; color: white; border-radius: 50%; width: 55px; height: 55px; border: 2px solid #EADDCA; cursor: pointer; font-size: 20px; z-index: 1000; }
        
        #chat-window { display: none; position: fixed; bottom: 90px; right: 20px; width: 280px; height: 350px; background: #002366; border-radius: 12px; padding: 15px; z-index: 1000; flex-direction: column; color: white; box-shadow: 0px 5px 15px rgba(0,0,0,0.2); }
        #chat-history { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; font-size: 0.85em; }
        #chat-input { width: 100%; padding: 7px; border-radius: 5px; border: none; background: #001a4d; color: white; }
        
        /* Footer con enlace verde oscuro */
        footer { margin-top: auto; padding-bottom: 10px; font-weight: bold; font-size: 0.9em; }
        footer a { color: #006400; text-decoration: none; }
    </style>
</head>
<body>

    <h1><img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="solana-icon" alt="Solana"> PANDA SWAP</h1>
    <div class="subtitulo">Plataforma de intercambio de criptomonedas de la red de Solana</div>

    <div class="container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <button class="btn-swap" onclick="window.open('https://jup.ag', '_blank')">HACER INTERCAMBIO</button>
        <div class="chart-container" id="tradingview_chart"></div>
    </div>

    <div id="chat-window">
        <div id="chat-history"><strong>Panda Bot:</strong> ¡Hola! Soy Panda Swap. Pregúntame por precios, qué es la red Solana o cómo operar.</div>
        <input type="text" id="chat-input" placeholder="Escribe aquí..." onkeydown="if(event.key==='Enter') sendMessage()">
    </div>
    
    <button class="btn-bot" onclick="toggleChat()">🐼</button>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        new TradingView.widget({"width": "100%", "height": 380, "symbol": "BINANCE:SOLUSDT", "interval": "D", "theme": "light", "style": "1", "locale": "es", "container_id": "tradingview_chart"});
        
        function toggleChat() { const chat = document.getElementById("chat-window"); chat.style.display = (chat.style.display === "flex") ? "none" : "flex"; }
        
        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const history = document.getElementById("chat-history");
            const text = input.value.toLowerCase();
            if (input.value.trim() === "") return;
            
            history.innerHTML += `<br><strong>Tú:</strong> ${input.value}`;
            
            let respuesta = "No estoy segura, ¿puedes preguntarme por 'precios' o 'cómo hacer swap'?";

            if (text.includes("precio") || text.includes("cuánto vale")) {
                try {
                    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana,bitcoin,ethereum,tether&vs_currencies=usd,ars');
                    const data = await res.json();
                    respuesta = `Precios actuales:<br>• SOL: $${data.solana.usd} USD / $${data.solana.ars} ARS<br>• BTC: $${data.bitcoin.usd} USD<br>• ETH: $${data.ethereum.usd} USD<br>• USDT: $${data.tether.usd} USD / $${data.tether.ars} ARS`;
                } catch { respuesta = "Error al consultar los precios."; }
            } else if (text.includes("swap") || text.includes("júpiter") || text.includes("usar")) {
                respuesta = "Para hacer un Swap en Panda Swap:<br>1. Conecta tu billetera Phantom.<br>2. Elige las monedas.<br>3. Verifica y confirma.";
            } else if (text.includes("billetera") || text.includes("phantom")) {
                respuesta = "Phantom es la billetera ideal para Solana. Asegúrate de tener saldo en SOL para las comisiones.";
            } else if (text.includes("hola")) {
                respuesta = "¡Hola! Puedo darte precios de SOL, BTC, ETH o USDT en USD y ARS, y guiarte en el uso de Panda Swap.";
            }
            
            setTimeout(() => { 
                history.innerHTML += `<br><strong>Panda Bot:</strong> ${respuesta}`; 
                history.scrollTop = history.scrollHeight; 
            }, 300);
            input.value = "";
        }
    </script>
    <footer><a href="mailto:pandaorizont@gmail.com">pandaorizon@gmail.com</a></footer>
</body>
</html>
